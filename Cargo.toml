[package]
name = "stm-rust-hobby"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embedded-hal = "1.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
sht4x = "0.2.0"
stm32f4xx-hal = { version = "0.23.0", features = ["stm32f411"] }

[profile.release]
debug = 2

[profile.dev]
opt-level = "s" # или 1 / 2 — подберите так, чтобы DHT11 стабильно читался
